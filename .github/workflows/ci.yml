name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Check imports
        run: |
          python -c "from src.utils.config import FEATURE_COLUMNS; print(f'Features: {len(FEATURE_COLUMNS)}')"
          python -c "from src.utils.metrics import haversine_distance; print('Metrics OK')"
          python -c "from src.s3_features.feature_engineering import main; print('Feature Eng OK')"
